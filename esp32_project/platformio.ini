[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Required libraries for AWS MQTT and WiFi
lib_deps = 
    arduino-libraries/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    WiFiManager@^2.0.16-rc.1

; Build flags for project configuration
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DASYNC_TCP_SSL_ENABLED=1
    -DMBEDTLS_SSL_CIPHERSUITES=MBEDTLS_TLS_RSA_WITH_AES_128_CBC_SHA,MBEDTLS_TLS_RSA_WITH_AES_256_CBC_SHA
    -DMBEDTLS_SSL_MAX_CONTENT_LEN=4096

; Monitor filters for better debugging
monitor_filters = esp32_exception_decoder, time, colorize